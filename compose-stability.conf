// Types the Compose compiler cannot see as stable: read-only collections and the immutable models of modules built
// without Compose. Declared stable, they are compared by value, so a list rebuilt with the same content (on every
// progress update of an import, for example) does not recompose what shows it.
kotlin.collections.List
kotlin.collections.Set
kotlin.collections.Map
com.vpr.screenlate.dictionary.api.registry.DictionaryEntity
com.vpr.screenlate.dictionary.api.catalog.CatalogEntry
com.vpr.screenlate.dictionary.api.imports.ImportTask
