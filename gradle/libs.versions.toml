ksp = "2.3.12"
hilt = "2.60.1"
androidxHilt = "1.4.0"
room = "2.8.5"
datastore = "1.2.1"
coreKtx = "1.19.1"
lifecycle = "2.11.0"
activityCompose = "1.13.0"
navigationCompose = "2.10.2"
work = "2.12.0"
webkit = "1.17.1"
composeBom = "2026.09.00"
