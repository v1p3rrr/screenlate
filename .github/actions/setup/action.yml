name: Set up the build
description: JDK, Gradle and the SDK packages the build needs.

runs:
  using: composite
  steps:
    - uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: 21

    - uses: gradle/actions/setup-gradle@v6
      with:
        # A sample in MNN's flatbuffers copy (submodule core/ocr-mnn/src/main/cpp/MNN) ships a wrapper JAR the
        # validation does not know; the build never runs it.
        allow-checksums: ee3739525a995bcb5601621a6e2daec1f183bbefc375743acc235cec33547e04

    - name: Install SDK packages
      shell: bash
      run: |
        yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
        "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
          "platforms;android-37.0" "ndk;29.0.14206865" "cmake;3.31.6" > /dev/null
