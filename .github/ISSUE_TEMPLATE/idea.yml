name: Idea
description: A new feature or a change to an existing one.
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What you would like
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: What it is for
      description: What you are trying to do, and what gets in the way now.
  - type: textarea
    id: how
    attributes:
      label: How it could work
      description: Optional. Screenshots or examples from other apps are welcome.
