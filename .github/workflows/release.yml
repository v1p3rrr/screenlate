name: Release

# A tag vX.Y.Z publishes a GitHub Release with one APK per ABI, a universal APK, the full source (with submodules)
# and a changelog. Publishing needs the release key in the repository secrets: SIGNING_KEYSTORE_BASE64,
# SIGNING_STORE_PASSWORD, SIGNING_KEY_ALIAS, SIGNING_KEY_PASSWORD. Without them, and on manual runs, the APKs are
# signed with the runner's debug key and kept as workflow artifacts only.

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || echo v0.1.0)-${GITHUB_SHA::7}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      # Made before building, so it holds sources only.
      - name: Source archive
        run: |
          tag="${{ steps.version.outputs.tag }}"
          echo "${tag#v}" | cut -d- -f1 > version.txt
          mkdir -p "$RUNNER_TEMP/out"
          tar --exclude-vcs --exclude='./dicts' --exclude='*/node_modules' \
            --transform "s,^\.,screenlate-$tag," -czf "$RUNNER_TEMP/out/screenlate-$tag-source.tar.gz" .
          rm version.txt

      - name: Changelog
        run: |
          previous="$(git describe --tags --abbrev=0 --match 'v[0-9]*' HEAD^ 2>/dev/null || true)"
          {
            echo "## Changes"
            echo
            git log --no-merges --pretty='- %s' ${previous:+$previous..}HEAD
          } > "$RUNNER_TEMP/changelog.md"

      - uses: ./.github/actions/setup

      - name: Signing key
        id: signing
        env:
          KEYSTORE: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
            {
              echo "storeFile=$RUNNER_TEMP/release.jks"
              echo "storePassword=$STORE_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPassword=$KEY_PASSWORD"
            } > keystore.properties
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release APKs
        run: |
          if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then
            ./gradlew :app:assembleRelease -Pscreenlate.splitAbis
          else
            ./gradlew :app:assembleRelease -Pscreenlate.splitAbis -Pscreenlate.debugSignedRelease
          fi
          rm -f keystore.properties
          tag="${{ steps.version.outputs.tag }}"
          for apk in app/build/outputs/apk/release/app-*-release.apk; do
            abi="$(basename "$apk" | sed -E 's/^app-(.*)-release\.apk$/\1/')"
            cp "$apk" "$RUNNER_TEMP/out/screenlate-$tag-$abi.apk"
          done
          ls -la "$RUNNER_TEMP/out"

      - name: Publish
        if: startsWith(github.ref, 'refs/tags/v') && steps.signing.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP"/out/* \
            --title "Screenlate $GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/changelog.md" --verify-tag

      - name: Keep as artifacts
        if: ${{ !(startsWith(github.ref, 'refs/tags/v') && steps.signing.outputs.signed == 'true') }}
        uses: actions/upload-artifact@v7
        with:
          name: screenlate-${{ steps.version.outputs.tag }}-unpublished
          path: ${{ runner.temp }}/out/
          retention-days: 14
          compression-level: 0

      - name: Summary
        if: ${{ steps.signing.outputs.signed != 'true' }}
        run: |
          echo "Not published: the release key is not in the repository secrets, so the APKs are signed with a" \
            "temporary debug key and kept as workflow artifacts." >> "$GITHUB_STEP_SUMMARY"
