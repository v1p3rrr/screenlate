<!doctype html>
<!--
  Known text in several fonts and sizes for the OCR comparison: page.html?lang=ru&theme=dark (javert: Japanese in columns; shc: Serbo-Croatian in Cyrillic, sh in Latin). Serve this folder from
  the computer (python -m http.server 8000) and open it on the emulator after `adb reverse tcp:8000 tcp:8000`.
-->
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OCR page</title>
<style>
  body { margin: 16px; background: #fff; color: #202124; font-family: sans-serif; }
  body.dark { background: #121212; color: #e8eaed; }
  h2 { font: bold 22px sans-serif; margin: 0 0 12px; }
  .sans { font: 16px/1.5 sans-serif; }
  .serif { font: 18px/1.5 serif; }
  .mono { font: 14px/1.5 monospace; }
  .small { font: 12px/1.4 sans-serif; color: #5f6368; }
  body.dark .small { color: #9aa0a6; }
  .link { font: 16px/1.5 sans-serif; color: #1a73e8; }
  body.dark .link { color: #8ab4f8; }
  p { margin: 0 0 12px; }
  html.vertical { writing-mode: vertical-rl; }
  html.vertical h2, html.vertical p { margin: 0 0 0 16px; }
</style>
</head>
<body>
<script src="texts.js"></script>
<script>
const params = new URLSearchParams(location.search);
const lang = params.get('lang') || 'ru';
// javert: the Japanese texts in vertical columns; zht: Traditional Chinese.
const vertical = lang === 'javert';
const texts = TEXTS[vertical ? 'ja' : lang];
const spaced = !['ja', 'javert', 'zh', 'zht'].includes(lang);
document.documentElement.lang = { javert: 'ja', zh: 'zh-CN', zht: 'zh-TW', shc: 'sr-Cyrl', sh: 'hr' }[lang] || lang;
if (vertical) document.documentElement.classList.add('vertical');
if (['ar', 'fa', 'he'].includes(lang)) document.documentElement.dir = 'rtl';
if (params.get('theme') === 'dark') document.body.classList.add('dark');
const blocks = [['h2', ''], ['p', 'sans'], ['p', 'serif'], ['p', 'mono'], ['p', 'link'], ['p', 'small']];
blocks.forEach(([tag, style], i) => {
  const element = document.createElement(tag);
  if (style) element.className = style;
  element.textContent = tag === 'h2' ? texts[0] : [texts[i % texts.length], texts[(i + 2) % texts.length]].join(spaced ? ' ' : '');
  document.body.appendChild(element);
});
</script>
</body>
</html>
